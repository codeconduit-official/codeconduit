name: Release CodeConduit

# Manual release: test the source, publish to GitHub Pages, test the live site,
# and only then create the version tag and GitHub release.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump for the new tag
        type: choice
        options: [patch, minor, major]
        default: patch
      dry_run:
        description: Test only. Do not publish or tag.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    name: Test source
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Work out the next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          latest=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            next=v1.0.0
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              *) patch=$((patch + 1)) ;;
            esac
            next="v$major.$minor.$patch"
          fi
          echo "Next version: $next"
          echo "version=$next" >> "$GITHUB_OUTPUT"
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test

  deploy:
    name: Publish to GitHub Pages
    needs: test
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp the version into the page
        env:
          VERSION: ${{ needs.test.outputs.version }}
        run: sed -i "s/name=\"codeconduit-version\" content=\"dev\"/name=\"codeconduit-version\" content=\"${VERSION}\"/" site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: Test the live site
    needs: [test, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Run the tests against the live site
        env:
          BASE_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECT_VERSION: ${{ needs.test.outputs.version }}
        run: node scripts/test.mjs

  release:
    name: Create the release tag
    needs: [test, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.test.outputs.version }}
        run: gh release create "$VERSION" --target "$GITHUB_SHA" --title "CodeConduit $VERSION" --generate-notes
